version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      expo:
        patterns:
          [
            "expo",
            "expo-*",
            "@expo/*",
            "react",
            "react-native",
            "react-native-*",
          ]
